services:

  mongo:
    image: mongo:7
    container_name: carrito-mongo
    restart: "no"

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: carrito-api

    restart: "no"

    env_file:
      - .env

    environment:
      PORT: 3000

      MONGO_URI: mongodb://mongo:27017/carrito_jwt_oauth

      JWT_SECRET: ${JWT_SECRET:-docker-secret-carrito}

      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-docker-client-id}

      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-docker-client-secret}

      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google/callback}

    ports:
      - "3000:3000"

    depends_on:
      mongo:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/login.html').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  tests:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: carrito-tests

    restart: "no"

    environment:
      NODE_ENV: test

      MONGO_URI: mongodb://mongo:27017/carrito_jwt_oauth_test

      JWT_SECRET: docker-test-secret

      JWT_EXPIRES_IN: 2h

    command: ["npm", "test"]

    depends_on:
      mongo:
        condition: service_healthy

      api:
        condition: service_healthy


volumes:
  mongo_data: